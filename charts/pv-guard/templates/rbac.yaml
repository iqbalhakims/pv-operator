apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pv-guard.fullname" . }}
  labels:
    {{- include "pv-guard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"{{ if .Values.policy.enforceRetain }}, "patch"{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pv-guard.fullname" . }}
  labels:
    {{- include "pv-guard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pv-guard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pv-guard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
