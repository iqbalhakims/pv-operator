apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-guard
  namespace: pv-guard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-guard
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    # patch is only used when --enforce-retain=true
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-guard
subjects:
  - kind: ServiceAccount
    name: pv-guard
    namespace: pv-guard-system
